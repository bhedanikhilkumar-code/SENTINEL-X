# ── Alembic configuration for SENTINEL-X ─────────────────────────────────────
# CHANGED: sqlalchemy.url now uses psycopg2 sync driver (required by Alembic).
#          The actual URL is overridden at runtime from .env SYNC_DATABASE_URL.

[alembic]
script_location = alembic
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
prepend_sys_path = .
version_locations = %(here)s/alembic/versions
truncate_slug_length = 40

# Default sync URL — env.py overrides this from SYNC_DATABASE_URL in .env
sqlalchemy.url = postgresql+psycopg2://sentinel:sentinel123@localhost:5432/sentinelx

[post_write_hooks]

# ── Logging ───────────────────────────────────────────────────────────────────
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
