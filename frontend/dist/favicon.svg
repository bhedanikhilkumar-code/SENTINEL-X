  <line x1="256" y1="280" x2="256" y2="330" stroke="#00f0ff" stroke-width="6" stroke-linecap="round"/>
  <line x1="160" y1="235" x2="210" y2="235" stroke="#00f0ff" stroke-width="6" stroke-linecap="round"/>
  <line x1="302" y1="235" x2="352" y2="235" stroke="#00f0ff" stroke-width="6" stroke-linecap="round"/>

